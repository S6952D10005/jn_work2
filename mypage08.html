<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <!-- HTML Element Form -->
    <form action="" method="">
      <label for="">ชื่อ-นามสกุล</label>
      <input type="text" name="" id="" />
      <br /><br />
      <label for="">อายุ</label>
      <input type="number" name="" id="" />
      <br /><br />
      <label for="">อีเมล์</label>
      <input type="email" placeholder="example@gmail.com" name="" id="" />
      <br /><br />
      <label for="">รหัสผ่าน</label>
      <input type="password" placeholder="อย่างน้อย 6 ตัว" name="" id="" />
      <br /><br />
      <label for="">ประวัติส่วนตัว</label>
      <textarea name="" id=""></textarea>
      <!-- แบบเลือก -->
      <br /><br />
      <label for="">เพศ</label>
      <input type="radio" name="sex" id="" />ชาย
      <input type="radio" name="sex" id="" />หญิง
      <input type="radio" name="sex" id="" />LGBTQ+
      <input type="radio" name="sex" id="" />ไม่ระบุ <br /><br />
      <label for="">จังหวัดบ้านเกิด</label>
      <search name="" id="">
        <option value="">กรุงเทพ</option>
        <option value="">นครปฐม</option>
        <option value="">ชลบุรี</option>
        <option value="">ระยอง</option>
        <option value="" selected>จันทบุรี</option>
        <option value="">ตราด</option>
        <option value="">สุราษฎร์ธานี</option>
        <option value="">นครศรีธรรมราช</option>
      </search>
      <br /><br />
      <label for="">อาหารที่ชอบ</label>
      <input type="checkbox" name="" id="" />ผัดกะเพรา
      <input type="checkbox" name="" id="" />ต้มยำกุ้ง
      <input type="checkbox" name="" id="" />ส้มตำ
      <input type="checkbox" name="" id="" />อื่นๆ <br /><br />
      <label for="">วันเดือนปี เกิด</label>
      <input type="date" name="" id="" />
      <br /><br />
      <label for="">เวลาตกฟาก</label>
      <input type="text" name="" id="" />
      <br /><br />
      <label for="">วันเวลาเข้าทำงาน</label>
      <input type="datetime-local" name="" id="" />
      <br /><br />
      <label for="">เลือกไฟล์</label>
      <input type="file" name="" id="" accept="image/*" />
      <br /><br />
      <label for="">เลือกไฟล์ word,pdf</label>
      <input type="file" name="" id="" accept=".doc, .docx, ,pdf" />
      <!--  ปุ่มกด -->
      <br /><br />
      <input type="submit" value="ตกลง/บันทึก/OK" />
      <input type="reset" value="ยกเลิก/ล้างข้อมูล" />
      <br /><br />
      <button>ตกลง</button>
      <button>WOW WOW WOW</button>
    </form>
  </body>
</html>
